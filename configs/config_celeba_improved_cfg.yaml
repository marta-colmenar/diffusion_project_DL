training:
  run_name: "celeba"
  evaluation_metric: "FID"
  fid_eval_freq: 5
  fid_steps: 40
  fid_num_samples: 1000
  checkpoint_freq: 5
  learning_rate: 0.0001
  num_epochs: 500
  cfg_drop_prob: 0.1
  
data:
  dataset_name: "CelebA"
  data_root: "data"
  batch_size: 128
  num_workers: 8
  pin_memory: true

model:
  model_name: "unet_attention" # or unet or basic
  nb_channels: 64
  num_blocks: 2
  cond_channels: 32
  conditioned: True # Refers to noise (sigma) conditioning
  cf_guidance: True # Refers to classifier-free guidance

diffusion:
  sigma_min: 0.002
  sigma_max: 80.0
